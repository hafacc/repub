# Build a tagged version and attach it to a GitHub release; safe to rerun on the same tag.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: bun install --frozen-lockfile
      - run: bun export
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ inputs.tag }}
        run: |
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" repub.zip --clobber
          else
            gh release create "$tag" --generate-notes --verify-tag repub.zip
          fi
