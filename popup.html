<!doctype html>
<html lang="en">
  <head>
    <title>Set EPub Metadata</title>
  </head>
  <style>
    body {
      background-color: rgb(250, 246, 240);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1a1a1a;
      font-size: 13px;
    }

    #flex {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 20rem;
    }

    #where {
      font-size: 0.65rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #6b6257;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      position: relative;
    }

    label {
      font-size: 0.75rem;
      color: #4a443c;
    }

    input {
      outline: 0;
      border-radius: 0;
      padding: 0.25rem 0 0.35rem 0;
      border: 0;
      border-bottom: 0.1rem solid black;
      background-color: transparent;
      transition: border ease-in-out;
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      color: inherit;
    }

    input:focus {
      border-bottom-width: 0.2rem;
      padding: 0.25rem 0;
    }

    input:disabled {
      color: #7d756a;
      border-bottom-color: #a39a8d;
    }

    #tag-box {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      border-bottom: 0.1rem solid black;
      padding: 0.25rem 0 0.35rem 0;
      min-height: 1.4rem;
    }

    #tag-box.focus {
      border-bottom-width: 0.2rem;
      padding-bottom: 0.25rem;
    }

    #tag-box input {
      border: 0;
      padding: 0;
      flex: 1 1 4rem;
      min-width: 4rem;
      width: auto;
    }

    #tag-box input:focus {
      padding: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background-color: #ece3d6;
      border: 1px solid #cdbfa9;
      padding: 0 0.25rem 0 0.4rem;
      font-size: 0.72rem;
      line-height: 1.2rem;
    }

    .chip button {
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      font-size: 0.85rem;
      line-height: 0.8rem;
      color: #6b6257;
      cursor: pointer;
    }

    #tag-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      margin-top: 0.2rem;
      background-color: #ffffff;
      border: 1px solid #cdbfa9;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      z-index: 2;
    }

    #tag-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      font: inherit;
      font-size: 0.78rem;
      color: inherit;
      padding: 0.3rem 0.45rem;
      cursor: pointer;
    }

    #tag-menu button.on,
    #tag-menu button:hover {
      background-color: #f2ebe0;
    }

    #tag-menu button.new {
      color: #4a443c;
      border-top: 1px solid #e6dccd;
    }

    #submit {
      background-color: black;
      padding: 0.4rem;
      color: white;
      width: 100%;
      text-transform: uppercase;
      border: 0;
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    #submit:disabled {
      background-color: #7d756a;
      cursor: default;
    }

    #error {
      font-size: 0.75rem;
      color: #a8200f;
    }
  </style>
  <body>
    <div id="flex">
      <span id="where"></span>
      <div id="bar"><span id="bar-run"></span></div>
      <div class="field">
        <label for="title-input">Title</label>
        <input id="title-input" disabled />
      </div>
      <div class="field">
        <label for="author-input">Author</label>
        <input id="author-input" disabled />
      </div>
      <div class="field" id="tags-field" hidden>
        <label for="tag-input">Tags</label>
        <div id="tag-host"></div>
      </div>
      <button id="submit" type="button" disabled>Capture</button>
      <span id="error"></span>
    </div>
  </body>
  <script src="popup.js" type="module"></script>
</html>
