<!doctype html>
<html lang="en">
  <head>
    <title>Set EPub Metadata</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="flex">
      <span id="where"></span>
      <div id="bar"><span id="bar-run"></span></div>
      <div class="field">
        <label for="title-input">Title</label>
        <input id="title-input" disabled />
      </div>
      <div class="field">
        <label for="author-input">Author</label>
        <input id="author-input" disabled />
      </div>
      <div class="field" id="tags-field" hidden>
        <label for="tag-input">Tags</label>
        <div id="tag-host"></div>
      </div>
      <button id="submit" type="button" disabled>Capture</button>
      <span id="error"></span>
    </div>
  </body>
  <script src="popup.js" type="module"></script>
</html>
